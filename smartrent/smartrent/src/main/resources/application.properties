# Server
server.port=8080

# Default profile for local development
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}
# Convenience profile groups for local AI providers
spring.profiles.group.ai-openai=local,openai
spring.profiles.group.ai-groq=local,groq
spring.profiles.group.ai-ollama=local,ollama
spring.profiles.group.ai-openai-mysql=mysql,openai
spring.profiles.group.ai-groq-mysql=mysql,groq
spring.profiles.group.ai-ollama-mysql=mysql,ollama
spring.profiles.group.ai-gemini=local,gemini
spring.profiles.group.ai-gemini-mysql=mysql,gemini

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# App name
spring.application.name=smartrent

# Force JDK HTTP client to avoid Apache HttpComponents classpath conflicts.
spring.http.clients.imperative.factory=JDK
# Spring AI 2.0.0-M2 can create ChatClient auto-config even when no ChatModel exists.
# We provide our own conditional ChatClient.Builder bean instead.
spring.autoconfigure.exclude=org.springframework.ai.model.chat.client.autoconfigure.ChatClientAutoConfiguration

# OpenAI
# Disable AI chat model by default to avoid startup failure when API key is missing.
# Enable with profile: SPRING_PROFILES_ACTIVE=local,openai
# Or enable directly: SPRING_AI_MODEL_CHAT=openai
spring.ai.model.chat=${SPRING_AI_MODEL_CHAT:none}
# Use a non-empty fallback to prevent startup crash when model is enabled without key.
spring.ai.openai.api-key=${OPENAI_API_KEY:dummy-key}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.3

# JWT
jwt.secret=${JWT_SECRET:change-me-with-a-strong-jwt-secret}
jwt.expiration=86400000
# 86400000ms = 24 gi?

# File upload
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
