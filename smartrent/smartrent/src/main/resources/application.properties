# Server
server.port=8080

# Default profile for local development
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# App name
spring.application.name=smartrent

# Force JDK HTTP client to avoid Apache HttpComponents classpath conflicts.
spring.http.clients.imperative.factory=JDK

# OpenAI
# Disable AI chat model by default to avoid startup failure when API key is missing.
# Enable with: SPRING_AI_MODEL_CHAT=openai
spring.ai.model.chat=${SPRING_AI_MODEL_CHAT:none}
# Use a non-empty fallback to prevent startup crash when model is enabled without key.
spring.ai.openai.api-key=${OPENAI_API_KEY:dummy-key}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.3

# JWT
jwt.secret=smartrent_super_secret_key_2024_must_be_at_least_256_bits_long
jwt.expiration=86400000
# 86400000ms = 24 gi?

# File upload
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
